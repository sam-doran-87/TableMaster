<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Encounter List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Link to the separate CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>RPG Encounter List</h1>

        <div class="main-content">
            <!-- Encounter Tracker Card -->
            <div class="encounter-tracker-card">
                <div class="input-section">
                    <input type="text" id="newItemText" placeholder="Character Name">
                    <input type="number" id="newItemInitiative" placeholder="Initiative">
                    <button id="addItemButton">Add Character</button>
                    <button id="sortInitiativeButton" class="sort-button">Sort by Initiative</button>
                </div>

                <ul id="sortable-list" class="sortable-list">
                    <!-- List items will be dynamically added here -->
                </ul>

                <div class="turn-controls">
                    <div class="turn-round-info">
                        <span id="currentTurnDisplay" class="info-item">Current Turn: None</span>
                        <span id="roundDisplay" class="info-item">Round: 1</span>
                    </div>
                    <button id="nextTurnButton" class="turn-button">Next Turn <i class="fas fa-arrow-right"></i></button>
                    <button id="previousTurnButton" class="turn-button prev-button">Previous Turn <i class="fas fa-arrow-left"></i></button>
                </div>
            </div>

            <!-- Dice Roller Card -->
            <div class="dice-roller-card">
                <div class="dice-header">
                    <h2>Dice Roller</h2>
                    <button id="toggleDiceRollerButton" class="toggle-button">
                        <i class="fas fa-chevron-down"></i>
                    </button>
                </div>
                <div id="diceRollerContent" class="dice-content">
                    <div class="dice-input-group">
                        <input type="number" id="numDiceInput" value="1" min="1" max="10">
                        <span>d</span>
                        <select id="dieTypeSelect">
                            <option value="4">4</option>
                            <option value="6">6</option>
                            <option value="8">8</option>
                            <option value="10">10</option>
                            <option value="12">12</option>
                            <option value="20">20</option>
                            <option value="100">100</option>
                        </select>
                        <button id="rollDiceButton">Roll</button>
                    </div>

                    <div class="dice-modifiers-section">
                        <div class="modifier-input-group">
                            <label for="modifierInput">Modifier:</label>
                            <input type="number" id="modifierInput" value="0">
                        </div>
                        <div class="roll-type-group">
                            <input type="radio" id="normal" name="rollType" value="normal" checked>
                            <label for="normal">Normal</label>
                            <input type="radio" id="advantage" name="rollType" value="advantage">
                            <label for="advantage">Advantage</label>
                            <input type="radio" id="disadvantage" name="rollType" value="disadvantage">
                            <label for="disadvantage">Disadvantage</label>
                        </div>
                        <div class="invert-d100-group">
                            <input type="checkbox" id="invertD100Checkbox">
                            <label for="invertD100Checkbox">Invert Advantage/Disadvantage (d100)</label>
                        </div>
                    </div>

                    <div id="diceRollOutput" class="dice-output">
                        <p>Total: 0</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Modal for Confirmation -->
    <div id="customModal" class="custom-modal-overlay">
        <div class="custom-modal-content">
            <p id="modalMessage">Are you sure you want to delete this character?</p>
            <div class="modal-buttons">
                <button id="modalConfirmButton">Yes</button>
                <button id="modalCancelButton">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Store the state of the encounter list and the current turn/round
        let encounterItems = [];
        let currentTurnIndex = -1;
        let round = 1;
        
        // --- DOM Elements ---
        const addItemButton = document.getElementById('addItemButton');
        const sortInitiativeButton = document.getElementById('sortInitiativeButton');
        const newItemText = document.getElementById('newItemText');
        const newItemInitiative = document.getElementById('newItemInitiative');
        const sortableList = document.getElementById('sortable-list');
        const nextTurnButton = document.getElementById('nextTurnButton');
        const previousTurnButton = document.getElementById('previousTurnButton');
        const currentTurnDisplay = document.getElementById('currentTurnDisplay');
        const roundDisplay = document.getElementById('roundDisplay');
        const toggleDiceRollerButton = document.getElementById('toggleDiceRollerButton');
        const diceRollerContent = document.getElementById('diceRollerContent');
        const rollDiceButton = document.getElementById('rollDiceButton');
        const numDiceInput = document.getElementById('numDiceInput');
        const dieTypeSelect = document.getElementById('dieTypeSelect');
        const modifierInput = document.getElementById('modifierInput');
        const diceRollOutput = document.getElementById('diceRollOutput');
        const rollTypeNormal = document.getElementById('normal');
        const rollTypeAdvantage = document.getElementById('advantage');
        const rollTypeDisadvantage = document.getElementById('disadvantage');
        const invertD100Checkbox = document.getElementById('invertD100Checkbox');

        // Modal elements
        const customModal = document.getElementById('customModal');
        const modalMessage = document.getElementById('modalMessage');
        const modalConfirmButton = document.getElementById('modalConfirmButton');
        const modalCancelButton = document.getElementById('modalCancelButton');

        // --- Utility Functions ---

        /**
         * Saves the current state of the encounter list and turn/round info to local storage.
         */
        const saveState = () => {
            localStorage.setItem('encounterItems', JSON.stringify(encounterItems));
            localStorage.setItem('currentTurnIndex', currentTurnIndex);
            localStorage.setItem('round', round);
        };

        /**
         * Loads the state from local storage.
         */
        const loadState = () => {
            const savedItems = localStorage.getItem('encounterItems');
            const savedTurnIndex = localStorage.getItem('currentTurnIndex');
            const savedRound = localStorage.getItem('round');

            if (savedItems) {
                encounterItems = JSON.parse(savedItems);
                renderList();
            }

            if (savedTurnIndex !== null) {
                currentTurnIndex = parseInt(savedTurnIndex, 10);
            }

            if (savedRound !== null) {
                round = parseInt(savedRound, 10);
            }
            updateTurnDisplay();
        };

        /**
         * Renders the list of characters on the page.
         */
        const renderList = () => {
            sortableList.innerHTML = '';
            encounterItems.forEach((item, index) => {
                const li = document.createElement('li');
                li.classList.add('list-item');
                if (index === currentTurnIndex) {
                    li.classList.add('active-turn');
                }
                li.innerHTML = `
                    <span class="item-text">${item.name}</span>
                    <span class="item-initiative">Init: ${item.initiative}</span>
                    <div class="item-actions">
                        <button class="delete-button" data-index="${index}">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                        <button class="edit-button" data-index="${index}">
                            <i class="fas fa-edit"></i>
                        </button>
                    </div>
                `;
                sortableList.appendChild(li);
            });
            saveState();
        };

        // --- MODAL FIX ---
        // This promise-based approach is a clean way to handle confirmation dialogs.
        // It provides a single point of entry and exit, making the logic much clearer.
        let modalResolve;
        const showModal = (message) => {
            return new Promise((resolve) => {
                modalMessage.textContent = message;
                customModal.classList.add('is-visible');
                modalResolve = resolve;
            });
        };

        // Attach a single listener for the confirm button
        modalConfirmButton.addEventListener('click', () => {
            if (modalResolve) {
                modalResolve(true);
                customModal.classList.remove('is-visible');
                modalResolve = null;
            }
        });

        // Attach a single listener for the cancel button
        modalCancelButton.addEventListener('click', () => {
            if (modalResolve) {
                modalResolve(false);
                customModal.classList.remove('is-visible');
                modalResolve = null;
            }
        });

        /**
         * Updates the turn and round display on the page.
         */
        const updateTurnDisplay = () => {
            if (encounterItems.length > 0 && currentTurnIndex >= 0) {
                currentTurnDisplay.textContent = `Current Turn: ${encounterItems[currentTurnIndex].name}`;
            } else {
                currentTurnDisplay.textContent = 'Current Turn: None';
            }
            roundDisplay.textContent = `Round: ${round}`;
            renderList();
        };

        // --- Encounter Tracker Logic ---

        // Add a new character to the list
        addItemButton.addEventListener('click', () => {
            const name = newItemText.value.trim();
            const initiative = parseInt(newItemInitiative.value, 10);

            if (name && !isNaN(initiative)) {
                encounterItems.push({ name, initiative });
                renderList();
                newItemText.value = '';
                newItemInitiative.value = '';
            } else {
                console.error("Please enter a valid name and initiative.");
            }
        });

        // Sort the list by initiative
        sortInitiativeButton.addEventListener('click', () => {
            encounterItems.sort((a, b) => b.initiative - a.initiative);
            currentTurnIndex = -1; // Reset turn after sorting
            round = 1;
            updateTurnDisplay();
        });

        // Event delegation for delete and edit buttons
        sortableList.addEventListener('click', async (e) => {
            if (e.target.closest('.delete-button')) {
                const index = parseInt(e.target.closest('.delete-button').dataset.index, 10);
                const isConfirmed = await showModal('Are you sure you want to delete this character?');

                if (isConfirmed) {
                    encounterItems.splice(index, 1);
                    if (currentTurnIndex >= index) {
                        currentTurnIndex--;
                    }
                    if (currentTurnIndex < 0 && encounterItems.length > 0) {
                        currentTurnIndex = 0; // Move to the new first item if applicable
                    }
                    if (encounterItems.length === 0) {
                        currentTurnIndex = -1;
                        round = 1;
                    }
                    updateTurnDisplay();
                }
            } else if (e.target.closest('.edit-button')) {
                const index = parseInt(e.target.closest('.edit-button').dataset.index, 10);
                const item = encounterItems[index];
                const newName = prompt("Edit character name:", item.name);
                const newInitiative = prompt("Edit initiative:", item.initiative);

                if (newName !== null && newInitiative !== null) {
                    const parsedInitiative = parseInt(newInitiative, 10);
                    if (!isNaN(parsedInitiative)) {
                        encounterItems[index] = { name: newName.trim(), initiative: parsedInitiative };
                        renderList();
                    } else {
                        console.error("Invalid initiative entered.");
                    }
                }
            }
        });

        // Next Turn logic
        nextTurnButton.addEventListener('click', () => {
            if (encounterItems.length === 0) {
                return;
            }

            currentTurnIndex++;
            if (currentTurnIndex >= encounterItems.length) {
                currentTurnIndex = 0;
                round++;
            }
            updateTurnDisplay();
        });

        // Previous Turn logic
        previousTurnButton.addEventListener('click', () => {
            if (encounterItems.length === 0) {
                return;
            }
            
            currentTurnIndex--;
            if (currentTurnIndex < 0) {
                if (round > 1) {
                    currentTurnIndex = encounterItems.length - 1;
                    round--;
                } else {
                    currentTurnIndex = 0; // Stay at the first item if it's the first round
                }
            }
            updateTurnDisplay();
        });

        // --- Dice Roller Logic ---
        
        // Function to toggle the visibility of the dice roller content
        const toggleDiceRoller = () => {
            diceRollerContent.classList.toggle('is-visible');
            toggleDiceRollerButton.querySelector('i').classList.toggle('fa-chevron-down');
            toggleDiceRollerButton.querySelector('i').classList.toggle('fa-chevron-up');
        };

        // Function to perform the dice roll
        const rollDice = () => {
            const numDice = parseInt(numDiceInput.value, 10) || 1;
            const dieType = parseInt(dieTypeSelect.value, 10) || 20;
            const modifier = parseInt(modifierInput.value, 10) || 0;
            const rollType = document.querySelector('input[name="rollType"]:checked').value;
            const isInverted = invertD100Checkbox.checked;

            let result;
            if (rollType === 'normal') {
                result = rollNormal(numDice, dieType);
            } else {
                result = rollWithAdvantageOrDisadvantage(dieType, rollType, isInverted);
            }

            displayDiceRollResult(result, modifier);
        };

        /**
         * Rolls a normal set of dice.
         * @param {number} numDice The number of dice to roll.
         * @param {number} dieType The type of die (e.g., 20 for d20).
         * @returns {{rolls: number[], total: number}} The roll results and total.
         */
        const rollNormal = (numDice, dieType) => {
            let rolls = [];
            let total = 0;
            for (let i = 0; i < numDice; i++) {
                const roll = Math.floor(Math.random() * dieType) + 1;
                rolls.push(roll);
                total += roll;
            }
            return { rolls, total };
        };

        /**
         * Rolls with advantage or disadvantage.
         * @param {number} dieType The type of die (e.g., 20 for d20).
         * @param {string} type 'advantage' or 'disadvantage'.
         * @param {boolean} isInverted True if d100 inverted logic is applied.
         * @returns {{rolls: number[], total: number, otherRolls: number[]}} The selected roll results and total.
         */
        const rollWithAdvantageOrDisadvantage = (dieType, type, isInverted) => {
            const roll1 = Math.floor(Math.random() * dieType) + 1;
            const roll2 = Math.floor(Math.random() * dieType) + 1;

            let chosenRoll, otherRoll;
            if (type === 'advantage') {
                chosenRoll = (isInverted) ? Math.min(roll1, roll2) : Math.max(roll1, roll2);
                otherRoll = (chosenRoll === roll1) ? roll2 : roll1;
            } else { // disadvantage
                chosenRoll = (isInverted) ? Math.max(roll1, roll2) : Math.min(roll1, roll2);
                otherRoll = (chosenRoll === roll1) ? roll2 : roll1;
            }

            return { rolls: [chosenRoll], total: chosenRoll, otherRolls: [otherRoll] };
        };

        /**
         * Displays the result of a dice roll.
         * @param {{rolls: number[], total: number, otherRolls?: number[]}} result The roll results.
         * @param {number} modifier The modifier value.
         */
        const displayDiceRollResult = (result, modifier) => {
            let outputHTML = '';
            const finalTotal = result.total + modifier;

            outputHTML += `<p>Rolls: ${result.rolls.join(', ')}</p>`;
            if (result.otherRolls) {
                outputHTML += `<p>Other Roll: ${result.otherRolls.join(', ')}</p>`;
            }

            if (modifier !== 0) {
                outputHTML += `<p>Modifier: ${modifier > 0 ? '+' : ''}${modifier}</p>`;
            }
            outputHTML += `<p>Total: <strong>${finalTotal}</strong></p>`;

            diceRollOutput.innerHTML = outputHTML;
        };

        // --- Event Listeners and Initial Load ---
        
        toggleDiceRollerButton.addEventListener('click', toggleDiceRoller);
        rollDiceButton.addEventListener('click', rollDice);

        // Set default die type
        dieTypeSelect.value = "20";

        // Load state and initialize sheet when the page finishes loading
        window.addEventListener('load', () => {
            loadState();
        });
    </script>
</body>
</html>
