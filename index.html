<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Encounter List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>RPG Encounter List</h1>

        <!-- Authentication Section -->
        <div class="auth-section">
            <div id="user-info" style="display: none;">
                <p>Logged in as: <span id="user-email-display"></span></p>
                <p>User ID: <span id="user-id-display"></span></p>
                <button id="logout-button" class="auth-button">Log Out</button>
            </div>
            <form id="login-form">
                <p id="auth-status-message" class="error-message" style="display: none;"></p>
                <input type="email" id="email-input" placeholder="Email" required>
                <input type="password" id="password-input" placeholder="Password" required>
                <button id="signin-button" type="submit" class="auth-button">Sign In</button>
                <button id="signup-button" type="button" class="auth-button">Sign Up</button>
            </form>
        </div>

        <div class="main-content">
            <div class="encounter-tracker-card">
                <div class="input-section">
                    <input type="text" id="newItemText" placeholder="Character Name">
                    <input type="number" id="newItemInitiative" placeholder="Initiative">
                    <button id="addItemButton">Add Character</button>
                    <button id="sortInitiativeButton" class="sort-button">Sort by Initiative</button>
                </div>

                <ul id="sortable-list" class="sortable-list">
                    <!-- List items will be dynamically added here -->
                </ul>

                <div class="turn-controls">
                    <div class="turn-round-info">
                        <span id="roundCounter">Round: 1</span>
                        <span id="turnCounter">Turn: --</span>
                    </div>
                    <div class="turn-buttons">
                        <button id="prevTurnButton" class="turn-button">Previous Turn</button>
                        <button id="nextTurnButton" class="turn-button">Next Turn</button>
                        <button id="resetTurnButton" class="reset-button">Reset Turns</button>
                    </div>
                </div>
            </div>

            <div id="character-sheet" class="character-sheet-card">
                <h2 id="sheet-title">Selected Character</h2>
                <div class="sheet-group">
                    <div class="sheet-section hp-section">
                        <p class="sheet-label">HP</p>
                        <div class="number-control-group">
                            <button class="number-btn decrement" data-target="sheet-current-hp">-</button>
                            <span id="sheet-current-hp" class="editable-field" contenteditable="true">--</span>
                            <button class="number-btn increment" data-target="sheet-current-hp">+</button>
                        </div>
                    </div>
                    <div class="sheet-section mp-section">
                        <p class="sheet-label">MP</p>
                        <div class="number-control-group">
                            <button class="number-btn decrement" data-target="sheet-mp">-</button>
                            <span id="sheet-mp" class="editable-field" contenteditable="true">--</span>
                            <button class="number-btn increment" data-target="sheet-mp">+</button>
                        </div>
                    </div>
                </div>

                <div class="sheet-group">
                    <div class="sheet-section ac-section">
                        <p class="sheet-label">Armor</p>
                        <span id="sheet-ac" class="editable-field" contenteditable="true">--</span>
                    </div>
                    <div class="sheet-section speed-section">
                        <p class="sheet-label">Speed</p>
                        <span id="sheet-speed" class="editable-field" contenteditable="true">--</span>
                    </div>
                </div>

                <div class="sheet-section modifier-section">
                    <p class="sheet-label">Modifiers</p>
                    <div class="modifiers-list">
                        <label>
                            <input type="checkbox" class="modifier-checkbox" id="modifier-advantage">
                            Advantage
                        </label>
                        <label>
                            <input type="checkbox" class="modifier-checkbox" id="modifier-disadvantage">
                            Disadvantage
                        </label>
                        <div class="number-control-group">
                            <button class="number-btn decrement" data-target="sheet-modifier">-</button>
                            <input type="number" class="modifier-input" id="sheet-modifier" placeholder="Mod">
                            <button class="number-btn increment" data-target="sheet-modifier">+</button>
                        </div>
                    </div>
                </div>

                <div class="sheet-section status-section">
                    <p class="sheet-label">Status</p>
                    <div class="status-list">
                        <label><input type="checkbox" class="status-checkbox" id="status-poisoned">Poisoned</label>
                        <label><input type="checkbox" class="status-checkbox" id="status-burning">Burning</label>
                        <label><input type="checkbox" class="status-checkbox" id="status-immobile">Immobile</label>
                        <label><input type="checkbox" class="status-checkbox" id="status-ko">K.O.</label>
                        <label><input type="checkbox" class="status-checkbox" id="status-dead">Dead</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dice Roller Toggle Button -->
        <button id="toggle-dice-roller-button" class="toggle-button">Dice Roller <i class="fa-solid fa-dice"></i></button>

        <!-- Dice Roller Container -->
        <div id="dice-roller-container" class="dice-roller-card hidden">
            <h2>Dice Roller</h2>
            <div class="dice-input-section">
                <input type="number" id="num-dice-input" value="1" min="1">
                <span class="dice-x">d</span>
                <select id="die-type-select">
                    <option value="3">d3</option>
                    <option value="4">d4</option>
                    <option value="6">d6</option>
                    <option value="8">d8</option>
                    <option value="10">d10</option>
                    <option value="12">d12</option>
                    <option value="20">d20</option>
                    <option value="100">d100</option>
                </select>
                <button id="roll-dice-button">Roll</button>
            </div>

            <div class="dice-modifiers-section">
                <div class="modifier-input-group">
                    <label for="roll-modifier">Modifier:</label>
                    <input type="number" id="roll-modifier" value="0">
                </div>
                <div class="roll-type-group">
                    <label>
                        <input type="radio" name="roll-type" value="normal" checked> Normal
                    </label>
                    <label>
                        <input type="radio" name="roll-type" value="advantage"> Advantage
                    </label>
                    <label>
                        <input type="radio" name="roll-type" value="disadvantage"> Disadvantage
                    </label>
                </div>
            </div>

            <div id="dice-roll-output" class="dice-output">
                <!-- Roll results will be displayed here -->
            </div>
        </div>

    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, query, orderBy, getDocs, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import Sortable from "https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js";

        // Firebase Setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let db;
        let auth;
        let userId;
        let unsubscribeFromSnapshot;

        async function initializeFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                // Set up auth state change listener
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        userId = user.uid;
                        document.getElementById('user-info').style.display = 'flex';
                        document.getElementById('login-form').style.display = 'none';
                        document.getElementById('user-email-display').textContent = user.email || 'Anonymous User';
                        document.getElementById('user-id-display').textContent = user.uid;
                        console.log("Authenticated with user ID:", userId);

                        // Unsubscribe from previous snapshot listener if it exists
                        if (unsubscribeFromSnapshot) {
                            unsubscribeFromSnapshot();
                        }

                        // Set up new snapshot listener for the current user's data
                        unsubscribeFromSnapshot = onSnapshot(doc(db, "artifacts", appId, "users", userId, "data", "encounter_list"), (docSnapshot) => {
                            if (docSnapshot.exists()) {
                                const data = docSnapshot.data();
                                console.log("Current data from Firestore:", data);
                                if (data && data.characters) {
                                    loadState(data.characters);
                                }
                            } else {
                                console.log("No data found for this user. Starting with empty list.");
                                loadState([]);
                            }
                        }, (error) => {
                            console.error("Error listening to Firestore document:", error);
                        });
                    } else {
                        // User is signed out or not authenticated
                        userId = null;
                        document.getElementById('user-info').style.display = 'none';
                        document.getElementById('login-form').style.display = 'flex';
                        console.log("User is logged out.");
                        
                        if (unsubscribeFromSnapshot) {
                            unsubscribeFromSnapshot();
                        }

                        // Load empty list or handle a logged-out state
                        loadState([]);
                    }
                });

            } catch (e) {
                console.error("Firebase initialization failed:", e);
                // Fallback to anonymous sign-in if custom token fails
                try {
                    auth = getAuth();
                    await signInAnonymously(auth);
                } catch (e2) {
                    console.error("Anonymous sign-in failed:", e2);
                }
            }
        }

        initializeFirebase();

        // --- AUTHENTICATION FUNCTIONS ---
        async function signIn(email, password) {
            try {
                await signInWithEmailAndPassword(auth, email, password);
                console.log("Sign-in successful!");
            } catch (error) {
                console.error("Sign-in failed:", error.message);
                showAuthStatus(error.message);
            }
        }

        async function signUp(email, password) {
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                console.log("Sign-up successful!");
            } catch (error) {
                console.error("Sign-up failed:", error.message);
                showAuthStatus(error.message);
            }
        }

        async function handleLogout() {
            try {
                await signOut(auth);
                console.log("Logged out successfully.");
            } catch (error) {
                console.error("Logout failed:", error.message);
                showAuthStatus(error.message);
            }
        }

        function showAuthStatus(message) {
            const statusMessage = document.getElementById('auth-status-message');
            statusMessage.textContent = message;
            statusMessage.style.display = 'block';
        }

        // --- Get references to all necessary HTML elements ---
        const sortableList = document.getElementById('sortable-list');
        const newItemText = document.getElementById('newItemText');
        const newItemInitiative = document.getElementById('newItemInitiative');
        const addItemButton = document.getElementById('addItemButton');
        const sortInitiativeButton = document.getElementById('sortInitiativeButton');
        const nextTurnButton = document.getElementById('nextTurnButton');
        const prevTurnButton = document.getElementById('prevTurnButton');
        const roundCounter = document.getElementById('roundCounter');
        const turnCounter = document.getElementById('turnCounter');
        const resetTurnButton = document.getElementById('resetTurnButton');
        const characterSheet = document.getElementById('character-sheet');
        const sheetTitle = document.getElementById('sheet-title');
        const sheetCurrentHp = document.getElementById('sheet-current-hp');
        const sheetMp = document.getElementById('sheet-mp');
        const sheetAc = document.getElementById('sheet-ac');
        const sheetSpeed = document.getElementById('sheet-speed');
        const sheetModifier = document.getElementById('sheet-modifier');
        const statusCheckboxes = document.querySelectorAll('.status-checkbox');
        const modifierCheckboxes = document.querySelectorAll('.modifier-checkbox');
        const toggleDiceRollerButton = document.getElementById('toggle-dice-roller-button');
        const diceRollerContainer = document.getElementById('dice-roller-container');
        const numDiceInput = document.getElementById('num-dice-input');
        const dieTypeSelect = document.getElementById('die-type-select');
        const rollDiceButton = document.getElementById('roll-dice-button');
        const diceRollOutput = document.getElementById('dice-roll-output');
        const rollModifierInput = document.getElementById('roll-modifier');
        const rollTypeRadios = document.querySelectorAll('input[name="roll-type"]');
        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email-input');
        const passwordInput = document.getElementById('password-input');
        const signupButton = document.getElementById('signup-button');
        const logoutButton = document.getElementById('logout-button');

        let currentRound = 1;
        let highlightedIndex = -1;
        let turnOrder = [];

        // --- Initialize SortableJS ---
        const sortable = new Sortable(sortableList, {
            animation: 150,
            ghostClass: 'sortable-ghost',
            chosenClass: 'sortable-chosen',
            dragClass: 'sortable-drag',
            handle: '.handle',
            onEnd: function (evt) {
                // Ensure the data model is updated after a drag-and-drop
                turnOrder = Array.from(sortableList.children).map(li => JSON.parse(li.getAttribute('data-character')));
                saveState();
                updateTurnCounter();
            },
        });

        // --- Helper function to update a list item's data and its visual representation ---
        function updateListItem(listItem, key, value) {
            // Get the current character data, update it, and re-serialize
            const charData = JSON.parse(listItem.getAttribute('data-character'));
            charData[key] = value;
            listItem.setAttribute('data-character', JSON.stringify(charData));

            // Now, update the visible elements
            if (key === 'currentHp') {
                const hpElement = listItem.querySelector('.list-item-hp');
                if (hpElement) hpElement.textContent = `${value} HP`;
            } else if (key === 'initiative') {
                const initiativeElement = listItem.querySelector('.initiative-score');
                if (initiativeElement) initiativeElement.textContent = value;
            } else if (key === 'status') {
                updateStatusIcons(listItem, value);
            }
        }
        
        // --- Custom modal for confirmation
        function showCustomModal(message, callback) {
            const modalHtml = `
                <div id="customModalOverlay" class="custom-modal-overlay">
                    <div class="custom-modal">
                        <h3>Confirmation</h3>
                        <p>${message}</p>
                        <div class="custom-modal-buttons">
                            <button id="modalConfirmBtn" class="confirm-btn">Confirm</button>
                            <button id="modalCancelBtn" class="cancel-btn">Cancel</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);

            const modalOverlay = document.getElementById('customModalOverlay');
            const modalConfirmBtn = document.getElementById('modalConfirmBtn');
            const modalCancelBtn = document.getElementById('modalCancelBtn');

            modalConfirmBtn.addEventListener('click', () => {
                modalOverlay.remove();
                callback(true);
            });
            modalCancelBtn.addEventListener('click', () => {
                modalOverlay.remove();
                callback(false);
            });
        }

        // --- Function to clear the character sheet ---
        function clearCharacterSheet() {
            sheetTitle.textContent = 'Selected Character';
            sheetCurrentHp.textContent = '--';
            sheetMp.textContent = '--';
            sheetAc.textContent = '--';
            sheetSpeed.textContent = '--';
            sheetModifier.value = '';
            statusCheckboxes.forEach(checkbox => checkbox.checked = false);
            modifierCheckboxes.forEach(checkbox => checkbox.checked = false);
            characterSheet.style.display = 'none';
        }

        // --- Function to populate the character sheet ---
        function populateCharacterSheet(listItem) {
            if (!listItem) {
                clearCharacterSheet();
                return;
            }
        
            const charData = JSON.parse(listItem.getAttribute('data-character'));
        
            sheetTitle.textContent = charData.name;
            sheetCurrentHp.textContent = charData.currentHp;
            sheetMp.textContent = charData.mp;
            sheetAc.textContent = charData.ac;
            sheetSpeed.textContent = charData.speed;
            sheetModifier.value = charData.modifier;
            characterSheet.style.display = 'block';
        
            // Update status checkboxes
            statusCheckboxes.forEach(checkbox => {
                const statusKey = checkbox.id.replace('status-', '');
                checkbox.checked = charData.status[statusKey] || false;
            });
        
            // Update modifier checkboxes
            modifierCheckboxes.forEach(checkbox => {
                const modifierKey = checkbox.id.replace('modifier-', '');
                checkbox.checked = charData.status[modifierKey] || false;
            });
        }

        // --- Update the highlighted list item and character sheet ---
        function updateHighlight(newIndex) {
            const listItems = sortableList.querySelectorAll('li');
            listItems.forEach((item, index) => {
                if (index === newIndex) {
                    item.classList.add('highlighted');
                    populateCharacterSheet(item);
                } else {
                    item.classList.remove('highlighted');
                }
            });
        
            highlightedIndex = newIndex;
            updateTurnCounter();
        
            if (newIndex === null || newIndex === -1) {
                clearCharacterSheet();
            }
        
            saveState();
        }

        // --- Function to update the round and turn counters ---
        function updateRoundCounter() {
            roundCounter.textContent = `Round: ${currentRound}`;
        }
        function updateTurnCounter() {
            const listItems = sortableList.querySelectorAll('li');
            const turnText = (highlightedIndex !== null && highlightedIndex !== -1 && listItems.length > 0) ? `${highlightedIndex + 1}` : '--';
            turnCounter.textContent = `Turn: ${turnText}`;
        }

        // --- Function to create and add a new list item to the DOM ---
        function createListItemElement(characterData) {
            const listItem = document.createElement('li');
            listItem.setAttribute('data-character', JSON.stringify(characterData));
        
            const handleSpan = document.createElement('span');
            handleSpan.classList.add('handle');
            handleSpan.innerHTML = '<i class="fa-solid fa-grip-lines"></i>';
        
            const lockButton = document.createElement('button');
            lockButton.classList.add('item-lock-button');
            lockButton.innerHTML = `<i class="fa-solid ${characterData.isLocked ? 'fa-lock' : 'fa-lock-open'}"></i>`;
        
            const itemTextSpan = document.createElement('span');
            itemTextSpan.classList.add('item-text');
            itemTextSpan.textContent = characterData.name;
        
            const initiativeScoreSpan = document.createElement('span');
            initiativeScoreSpan.classList.add('initiative-score');
            initiativeScoreSpan.textContent = characterData.initiative;
        
            const hpSpan = document.createElement('span');
            hpSpan.classList.add('list-item-hp');
            hpSpan.textContent = `${characterData.currentHp} HP`;
        
            const statusIconsDiv = document.createElement('div');
            statusIconsDiv.classList.add('status-icons');
            updateStatusIcons(statusIconsDiv, characterData.status);
        
            const removeButton = document.createElement('button');
            removeButton.classList.add('remove-button');
            removeButton.innerHTML = '<i class="fa-solid fa-trash"></i>';
        
            listItem.appendChild(handleSpan);
            listItem.appendChild(lockButton);
            listItem.appendChild(itemTextSpan);
            listItem.appendChild(initiativeScoreSpan);
            listItem.appendChild(hpSpan);
            listItem.appendChild(statusIconsDiv);
            listItem.appendChild(removeButton);
        
            return listItem;
        }

        // --- Function to Save the Current State to Firestore ---
        async function saveState() {
            if (!userId) {
                console.log("Not authenticated, skipping save to Firestore.");
                return;
            }
            try {
                const characters = Array.from(sortableList.children).map(li => JSON.parse(li.getAttribute('data-character')));
                const docRef = doc(db, "artifacts", appId, "users", userId, "data", "encounter_list");
                await setDoc(docRef, { characters, currentRound, highlightedIndex });
                console.log("State saved to Firestore.");
            } catch (e) {
                console.error("Error saving state to Firestore:", e);
            }
        }

        // --- Function to Load the State from a data object ---
        function loadState(characters) {
            sortableList.innerHTML = '';
            characters.forEach(charData => {
                const listItem = createListItemElement(charData);
                sortableList.appendChild(listItem);
            });
            turnOrder = characters; // Update the in-memory array
            
            // Re-apply highlight if needed
            if (highlightedIndex !== null && highlightedIndex !== -1 && turnOrder.length > 0) {
                const newIndex = Math.min(highlightedIndex, turnOrder.length - 1);
                updateHighlight(newIndex);
            } else {
                updateHighlight(null);
            }
            updateRoundCounter();
            updateTurnCounter();
        }

        // --- Function to Update Status Icons on a List Item ---
        function updateStatusIcons(element, statusObj) {
            let iconsHtml = '';
            if (statusObj.poisoned) iconsHtml += '<i class="fa-solid fa-skull-crossbones status-icon poisoned" title="Poisoned"></i>';
            if (statusObj.burning) iconsHtml += '<i class="fa-solid fa-fire status-icon burning" title="Burning"></i>';
            if (statusObj.immobile) iconsHtml += '<i class="fa-solid fa-shoe-prints status-icon immobile" title="Immobile"></i>';
            if (statusObj.ko) iconsHtml += '<i class="fa-solid fa-face-dizzy status-icon ko" title="Knocked Out"></i>';
            if (statusObj.dead) iconsHtml += '<i class="fa-solid fa-cross status-icon dead" title="Dead"></i>';
            if (statusObj.advantage) iconsHtml += '<i class="fa-solid fa-circle-plus status-icon advantage" title="Advantage"></i>';
            if (statusObj.disadvantage) iconsHtml += '<i class="fa-solid fa-circle-minus status-icon disadvantage" title="Disadvantage"></i>';
        
            // Find the status-icons container, whether it's the list item's or the sheet's
            const statusIconsContainer = element.classList.contains('status-icons') ? element : element.querySelector('.status-icons');
            if (statusIconsContainer) {
                statusIconsContainer.innerHTML = iconsHtml;
            }
        }
        
        // --- Event listeners for adding items ---
        function addListItem() {
            const nameText = newItemText.value.trim();
            const initiativeValue = newItemInitiative.value.trim();
            if (nameText.length > 0 && initiativeValue.length > 0) {
                const newCharacter = {
                    name: nameText,
                    initiative: initiativeValue,
                    currentHp: 10,
                    mp: 10,
                    ac: 0,
                    speed: 0,
                    modifier: 0,
                    status: {
                        poisoned: false, burning: false, immobile: false, ko: false, dead: false,
                        advantage: false, disadvantage: false
                    },
                    isLocked: false
                };
                
                const listItem = createListItemElement(newCharacter);
                sortableList.appendChild(listItem);
                turnOrder.push(newCharacter);
                
                newItemText.value = '';
                newItemInitiative.value = '';
                newItemText.focus();
                
                saveState();
            }
        }

        // --- Dice Roller functions ---
        function toggleDiceRoller() {
            diceRollerContainer.classList.toggle('hidden');
        }

        function rollDice() {
            const numDice = parseInt(numDiceInput.value);
            const dieType = parseInt(dieTypeSelect.value);
            const modifier = parseInt(rollModifierInput.value) || 0;
            let rollType = 'normal';
            rollTypeRadios.forEach(radio => {
                if (radio.checked) {
                    rollType = radio.value;
                }
            });

            if (isNaN(numDice) || isNaN(dieType) || numDice <= 0) {
                diceRollOutput.textContent = "Please enter a valid number of dice and select a die type.";
                return;
            }

            let total = 0;
            const rolls = [];

            if (rollType === 'advantage') {
                const roll1 = Math.floor(Math.random() * dieType) + 1;
                const roll2 = Math.floor(Math.random() * dieType) + 1;
                const finalRoll = Math.max(roll1, roll2);
                rolls.push(`(Advantage: ${roll1}, ${roll2}) -> ${finalRoll}`);
                total = finalRoll;
            } else if (rollType === 'disadvantage') {
                const roll1 = Math.floor(Math.random() * dieType) + 1;
                const roll2 = Math.floor(Math.random() * dieType) + 1;
                const finalRoll = Math.min(roll1, roll2);
                rolls.push(`(Disadvantage: ${roll1}, ${roll2}) -> ${finalRoll}`);
                total = finalRoll;
            } else { // Normal or multiple dice
                for (let i = 0; i < numDice; i++) {
                    const roll = Math.floor(Math.random() * dieType) + 1;
                    rolls.push(roll);
                    total += roll;
                }
            }

            const modifierText = modifier !== 0 ? ` + ${modifier}` : '';
            diceRollOutput.innerHTML = `<p>Rolls: ${rolls.join(', ')}</p><p>Total: <strong>${total + modifier}</strong></p>`;
        }
        
        // --- Event listeners ---
        addItemButton.addEventListener('click', addListItem);
        sortInitiativeButton.addEventListener('click', () => {
            const listItems = Array.from(sortableList.children);
            listItems.sort((a, b) => {
                const aInitiative = parseInt(JSON.parse(a.getAttribute('data-character')).initiative) || 0;
                const bInitiative = parseInt(JSON.parse(b.getAttribute('data-character')).initiative) || 0;
                return bInitiative - aInitiative;
            });
            listItems.forEach(item => sortableList.appendChild(item));
            updateHighlight(null);
            turnOrder = Array.from(sortableList.children).map(li => JSON.parse(li.getAttribute('data-character')));
            saveState();
        });

        sortableList.addEventListener('click', (event) => {
            const listItem = event.target.closest('li');
            if (listItem) {
                const isRemoveButton = event.target.closest('.remove-button');
                const isLockButton = event.target.closest('.item-lock-button');
                const index = Array.from(sortableList.children).indexOf(listItem);
                
                if (isRemoveButton) {
                    showCustomModal('Are you sure you want to remove this character?', (confirmed) => {
                        if (confirmed) {
                            listItem.remove();
                            turnOrder.splice(index, 1);
                            
                            // Adjust highlighted index if needed
                            if (highlightedIndex === index) {
                                highlightedIndex = -1;
                            } else if (highlightedIndex > index) {
                                highlightedIndex--;
                            }
                            
                            updateHighlight(highlightedIndex);
                            saveState();
                        }
                    });
                } else if (isLockButton) {
                    const charData = JSON.parse(listItem.getAttribute('data-character'));
                    charData.isLocked = !charData.isLocked;
                    listItem.setAttribute('data-character', JSON.stringify(charData));
                    const lockIcon = listItem.querySelector('.item-lock-button i');
                    lockIcon.classList.toggle('fa-lock');
                    lockIcon.classList.toggle('fa-lock-open');
                    saveState();
                } else {
                    updateHighlight(index);
                }
            }
        });

        nextTurnButton.addEventListener('click', () => {
            const listItems = sortableList.querySelectorAll('li');
            if (listItems.length === 0) return;
            highlightedIndex = (highlightedIndex + 1) % listItems.length;
            if (highlightedIndex === 0) {
                currentRound++;
            }
            updateHighlight(highlightedIndex);
            updateRoundCounter();
        });

        prevTurnButton.addEventListener('click', () => {
            const listItems = sortableList.querySelectorAll('li');
            if (listItems.length === 0) return;
            highlightedIndex--;
            if (highlightedIndex < 0) {
                highlightedIndex = listItems.length - 1;
                if (currentRound > 1) {
                    currentRound--;
                }
            }
            updateHighlight(highlightedIndex);
            updateRoundCounter();
        });

        resetTurnButton.addEventListener('click', () => {
            showCustomModal('Are you sure you want to reset all turns?', (confirmed) => {
                if (confirmed) {
                    currentRound = 1;
                    highlightedIndex = -1;
                    updateHighlight(highlightedIndex);
                    updateRoundCounter();
                }
            });
        });

        toggleDiceRollerButton.addEventListener('click', toggleDiceRoller);
        rollDiceButton.addEventListener('click', rollDice);

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = emailInput.value;
            const password = passwordInput.value;
            signIn(email, password);
        });

        signupButton.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            signUp(email, password);
        });

        logoutButton.addEventListener('click', handleLogout);

    </script>
</body>
</html>
