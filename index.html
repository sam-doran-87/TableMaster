<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Encounter List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Link to the custom style.css file -->
    <link rel="stylesheet" href="style.css">
    <!-- Import Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            signOut,
            onAuthStateChanged,
            signInWithCustomToken,
            signInAnonymously
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc,
            setDoc,
            collection,
            getDocs,
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global variables for Firebase access
        window.app = null;
        window.db = null;
        window.auth = null;
        window.userId = null;
        window.isAuthReady = false;

        // Use the global variables provided by the Canvas environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // Initialize Firebase
        try {
            if (Object.keys(firebaseConfig).length > 0) {
                window.app = initializeApp(firebaseConfig);
                window.auth = getAuth(window.app);
                window.db = getFirestore(window.app);
            } else {
                console.error("Firebase config is missing. The app will not function correctly.");
            }
        } catch (e) {
            console.error("Firebase initialization failed:", e);
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>RPG Encounter List</h1>

        <!-- Authentication Section -->
        <div id="auth-section" class="auth-section">
            <div id="user-info" style="display: none;">
                <p>Logged in as: <span id="user-email-display"></span></p>
                <button id="logout-button" class="auth-button">Sign Out</button>
            </div>
            <div id="login-form">
                <input type="email" id="email-input" placeholder="Email" required>
                <input type="password" id="password-input" placeholder="Password" required>
                <button id="signin-button" class="auth-button">Sign In</button>
                <button id="signup-button" class="auth-button">Sign Up</button>
                <p id="auth-error-message" class="error-message" style="display: none;"></p>
            </div>
        </div>
        
        <div class="main-content">
            <!-- Encounter Tracker Card -->
            <div class="encounter-tracker-card">
                <div class="input-section">
                    <input type="text" id="newItemText" placeholder="Character Name">
                    <input type="number" id="newItemInitiative" placeholder="Initiative">
                    <button id="addItemButton">Add Character</button>
                    <button id="sortInitiativeButton" class="sort-button">Sort by Initiative</button>
                </div>

                <ul id="sortable-list" class="sortable-list">
                    <!-- List items will be dynamically added here -->
                </ul>

                <div class="turn-controls">
                    <div class="turn-round-info">
                        <p>Round: <span id="roundCounter">0</span></p>
                        <p>Turn: <span id="turnCounter">0</span></p>
                    </div>
                    <div class="turn-buttons">
                        <button id="nextTurnButton" class="turn-button">Next Turn</button>
                        <button id="resetButton" class="reset-button">Reset</button>
                    </div>
                </div>
            </div>

            <!-- Character Sheet Card -->
            <div id="character-sheet" class="character-sheet-card" style="display: none;">
                <h2 id="sheet-title"></h2>
                
                <div class="sheet-group">
                    <div class="sheet-section">
                        <p class="sheet-label">Health</p>
                        <div class="number-control-group">
                            <button id="hp-minus-btn" class="number-btn">-</button>
                            <span id="sheet-hp" class="editable-field" contenteditable="true">0</span>
                            <button id="hp-plus-btn" class="number-btn">+</button>
                        </div>
                    </div>
                    <div class="sheet-section">
                        <p class="sheet-label">Initiative</p>
                        <div class="number-control-group">
                            <button id="init-minus-btn" class="number-btn">-</button>
                            <span id="sheet-initiative" class="editable-field" contenteditable="true">0</span>
                            <button id="init-plus-btn" class="number-btn">+</button>
                        </div>
                    </div>
                </div>

                <div class="sheet-group">
                    <div class="sheet-section">
                        <p class="sheet-label">Modifiers</p>
                        <div class="modifiers-list">
                            <label><input type="checkbox" class="modifier-checkbox" id="modifier-advantage">Advantage</label>
                            <label><input type="checkbox" class="modifier-checkbox" id="modifier-disadvantage">Disadvantage</label>
                        </div>
                    </div>
                    <div class="sheet-section">
                        <p class="sheet-label">Status</p>
                        <div class="status-list">
                            <label><input type="checkbox" class="status-checkbox" id="status-unconscious">Unconscious</label>
                            <label><input type="checkbox" class="status-checkbox" id="status-poisoned">Poisoned</label>
                        </div>
                    </div>
                </div>

                <div class="sheet-section">
                    <p class="sheet-label">Notes</p>
                    <div id="sheet-notes" class="notes-field" contenteditable="true" placeholder="Add notes here..."></div>
                </div>

                <button id="delete-sheet-button" class="reset-button">Delete Character</button>
            </div>
            
            <!-- Dice Roller Card -->
            <div id="dice-roller" class="dice-roller-card">
                <h2>Dice Roller</h2>
                <div class="dice-input-section">
                    <input type="number" id="num-dice-input" value="1" min="1" max="10">
                    <p class="dice-x">x</p>
                    <select id="die-type-select">
                        <option value="4">d4</option>
                        <option value="6">d6</option>
                        <option value="8">d8</option>
                        <option value="10">d10</option>
                        <option value="12">d12</option>
                        <option value="20">d20</option>
                        <option value="100">d100</option>
                    </select>
                    <button id="roll-dice-button" class="roll-button">Roll</button>
                </div>
                
                <div class="dice-output">
                    <p id="rollResults">Rolls: 0</p>
                    <p id="rollTotal">Total: 0</p>
                </div>

                <div class="dice-modifiers-section">
                    <div class="modifier-input-group">
                        <label for="roll-modifier">Modifier:</label>
                        <input type="number" id="roll-modifier" value="0">
                    </div>
                    <div class="roll-type-group">
                        <label><input type="radio" name="rollType" value="normal" checked>Normal</label>
                        <label><input type="radio" name="rollType" value="advantage">Advantage</label>
                        <label><input type="radio" name="rollType" value="disadvantage">Disadvantage</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        import {
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc,
            setDoc,
            collection,
            getDocs,
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Wait for Firebase to be initialized before getting instances
        let auth, db, userId;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // Get DOM elements
        const sortableList = document.getElementById('sortable-list');
        const newItemText = document.getElementById('newItemText');
        const newItemInitiative = document.getElementById('newItemInitiative');
        const addItemButton = document.getElementById('addItemButton');
        const sortInitiativeButton = document.getElementById('sortInitiativeButton');
        const characterSheet = document.getElementById('character-sheet');
        const sheetTitle = document.getElementById('sheet-title');
        const sheetHP = document.getElementById('sheet-hp');
        const hpMinusBtn = document.getElementById('hp-minus-btn');
        const hpPlusBtn = document.getElementById('hp-plus-btn');
        const sheetInitiative = document.getElementById('sheet-initiative');
        const initMinusBtn = document.getElementById('init-minus-btn');
        const initPlusBtn = document.getElementById('init-plus-btn');
        const sheetNotes = document.getElementById('sheet-notes');
        const deleteSheetButton = document.getElementById('delete-sheet-button');
        const roundCounter = document.getElementById('roundCounter');
        const turnCounter = document.getElementById('turnCounter');
        const nextTurnButton = document.getElementById('nextTurnButton');
        const resetButton = document.getElementById('resetButton');
        const modifierCheckboxes = document.querySelectorAll('.modifier-checkbox');
        const statusCheckboxes = document.querySelectorAll('.status-checkbox');
        
        // Dice Roller Elements
        const numDiceInput = document.getElementById('num-dice-input');
        const dieTypeSelect = document.getElementById('die-type-select');
        const rollDiceButton = document.getElementById('roll-dice-button');
        const rollResults = document.getElementById('rollResults');
        const rollTotal = document.getElementById('rollTotal');
        const rollModifierInput = document.getElementById('roll-modifier');
        const rollTypeRadios = document.querySelectorAll('input[name="rollType"]');

        // Authentication Elements
        const emailInput = document.getElementById('email-input');
        const passwordInput = document.getElementById('password-input');
        const signinButton = document.getElementById('signin-button');
        const signupButton = document.getElementById('signup-button');
        const logoutButton = document.getElementById('logout-button');
        const userInfoDiv = document.getElementById('user-info');
        const userEmailDisplay = document.getElementById('user-email-display');
        const authErrorMessage = document.getElementById('auth-error-message');
        const loginFormDiv = document.getElementById('login-form');

        let selectedCharacter = null;
        let characters = [];
        let currentTurnIndex = 0;
        let currentRound = 0;

        // Utility function to get the correct document path for a user's character
        const getCharacterDocRef = (charId) => {
            if (!userId) {
                console.error("User ID is not set. Cannot get document reference.");
                return null;
            }
            return doc(db, `/artifacts/${appId}/users/${userId}/characters`, charId);
        };

        // Custom Modal Functions
        const showModal = (message, onConfirm, onCancel) => {
            let modal = document.querySelector('.custom-modal-overlay');
            if (modal) modal.remove();

            const modalHtml = `
                <div class="custom-modal-overlay">
                    <div class="custom-modal">
                        <h3>${message}</h3>
                        <div class="custom-modal-buttons">
                            <button class="confirm-btn">Confirm</button>
                            <button class="cancel-btn">Cancel</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);

            modal = document.querySelector('.custom-modal-overlay');
            modal.querySelector('.confirm-btn').addEventListener('click', () => {
                onConfirm();
                modal.remove();
            });
            modal.querySelector('.cancel-btn').addEventListener('click', () => {
                if (onCancel) onCancel();
                modal.remove();
            });
        };

        // Firebase Auth State Listener
        onAuthStateChanged(window.auth, async (user) => {
            window.isAuthReady = true;
            if (user) {
                userId = user.uid;
                userEmailDisplay.textContent = user.email || 'Anonymous User';
                userInfoDiv.style.display = 'block';
                loginFormDiv.style.display = 'none';
                await loadCharacterSheets();
            } else {
                // If there's no logged-in user, sign in anonymously as a fallback
                if (window.auth && !window.auth.currentUser) {
                    try {
                        if (window.initialAuthToken) {
                            await signInWithCustomToken(window.auth, window.initialAuthToken);
                        } else {
                            await signInAnonymously(window.auth);
                        }
                    } catch (e) {
                        console.error("Anonymous login failed:", e);
                    }
                }
                userId = null;
                userInfoDiv.style.display = 'none';
                loginFormDiv.style.display = 'block';
                characters = [];
                renderList();
            }
        });

        // Auth Event Listeners
        signinButton.addEventListener('click', async (e) => {
            e.preventDefault();
            authErrorMessage.style.display = 'none';
            try {
                await signInWithEmailAndPassword(window.auth, emailInput.value, passwordInput.value);
            } catch (error) {
                authErrorMessage.textContent = error.message;
                authErrorMessage.style.display = 'block';
            }
        });

        signupButton.addEventListener('click', async (e) => {
            e.preventDefault();
            authErrorMessage.style.display = 'none';
            try {
                await createUserWithEmailAndPassword(window.auth, emailInput.value, passwordInput.value);
            } catch (error) {
                authErrorMessage.textContent = error.message;
                authErrorMessage.style.display = 'block';
            }
        });

        logoutButton.addEventListener('click', async (e) => {
            e.preventDefault();
            showModal('Are you sure you want to sign out? Your current session will be cleared.', async () => {
                try {
                    await signOut(window.auth);
                    characters = []; // Clear list on sign out
                    selectedCharacter = null;
                    characterSheet.style.display = 'none';
                    renderList();
                    // Reload or redirect to a clean state if needed
                } catch (error) {
                    console.error("Logout failed:", error);
                }
            });
        });

        // Function to save a character to Firestore
        const saveCharacterSheet = async (character) => {
            if (!userId) {
                console.error("Cannot save. User is not authenticated.");
                return;
            }
            try {
                const docRef = getCharacterDocRef(character.id);
                await setDoc(docRef, character);
            } catch (e) {
                console.error("Error saving document: ", e);
            }
        };

        // Function to load all characters from Firestore for the current user
        const loadCharacterSheets = async () => {
            if (!userId) {
                console.error("Cannot load. User is not authenticated.");
                return;
            }
            try {
                const charactersCol = collection(db, `/artifacts/${appId}/users/${userId}/characters`);
                const querySnapshot = await getDocs(charactersCol);
                characters = [];
                querySnapshot.forEach((doc) => {
                    characters.push(doc.data());
                });
                renderList();
            } catch (e) {
                console.error("Error loading characters: ", e);
            }
        };

        // --- Core Application Logic (mostly unchanged, but now uses the authenticated userId) ---

        const getCharacterIndexById = (id) => characters.findIndex(c => c.id === id);

        const updateSheetDisplay = (character) => {
            if (character) {
                sheetTitle.textContent = character.name;
                sheetHP.textContent = character.hp;
                sheetInitiative.textContent = character.initiative;
                sheetNotes.textContent = character.notes;
                
                // Update checkboxes
                modifierCheckboxes.forEach(checkbox => {
                    checkbox.checked = character.modifiers[checkbox.id.replace('modifier-', '')] || false;
                });
                statusCheckboxes.forEach(checkbox => {
                    checkbox.checked = character.status[checkbox.id.replace('status-', '')] || false;
                });

                characterSheet.style.display = 'flex';
                selectedCharacter = character;
            } else {
                characterSheet.style.display = 'none';
                selectedCharacter = null;
            }
        };

        const renderList = () => {
            sortableList.innerHTML = '';
            characters.forEach((char, index) => {
                const li = document.createElement('li');
                li.id = char.id;
                li.innerHTML = `
                    <span class="handle"><i class="fas fa-grip-lines"></i></span>
                    <span class="item-text">${char.name}</span>
                    <span class="initiative-score">${char.initiative}</span>
                    <span class="list-item-hp">HP: ${char.hp}</span>
                    <button class="item-lock-button">
                        <i class="fas fa-lock${char.locked ? '' : '-open'}"></i>
                    </button>
                    <button class="remove-button">
                        <i class="fas fa-times-circle"></i>
                    </button>
                `;
                li.addEventListener('click', (e) => {
                    if (e.target.closest('.remove-button') || e.target.closest('.item-lock-button')) {
                        return;
                    }
                    updateSheetDisplay(char);
                });
                sortableList.appendChild(li);
            });

            // Update highlighted character
            document.querySelectorAll('#sortable-list li').forEach(li => li.classList.remove('highlighted'));
            if (currentTurnIndex >= 0 && currentTurnIndex < characters.length) {
                const currentCharacterElement = document.getElementById(characters[currentTurnIndex].id);
                if (currentCharacterElement) {
                    currentCharacterElement.classList.add('highlighted');
                }
            }
        };

        addItemButton.addEventListener('click', () => {
            const name = newItemText.value.trim();
            const initiative = parseInt(newItemInitiative.value, 10);
            if (name && !isNaN(initiative)) {
                const newCharacter = {
                    id: crypto.randomUUID(),
                    name,
                    initiative,
                    hp: 10, // Default HP
                    locked: false,
                    notes: '',
                    modifiers: {},
                    status: {}
                };
                characters.push(newCharacter);
                saveCharacterSheet(newCharacter); // Save the new character
                newItemText.value = '';
                newItemInitiative.value = '';
                renderList();
            }
        });

        sortInitiativeButton.addEventListener('click', () => {
            characters.sort((a, b) => b.initiative - a.initiative);
            renderList();
        });

        sortableList.addEventListener('click', async (e) => {
            const listItem = e.target.closest('li');
            if (!listItem) return;
            const charId = listItem.id;

            if (e.target.closest('.remove-button')) {
                showModal('Are you sure you want to delete this character?', async () => {
                    try {
                        const docRef = getCharacterDocRef(charId);
                        await deleteDoc(docRef);
                        characters = characters.filter(char => char.id !== charId);
                        renderList();
                        if (selectedCharacter && selectedCharacter.id === charId) {
                            updateSheetDisplay(null);
                        }
                    } catch (error) {
                        console.error("Error deleting document: ", error);
                    }
                });
            } else if (e.target.closest('.item-lock-button')) {
                const charIndex = getCharacterIndexById(charId);
                if (charIndex !== -1) {
                    characters[charIndex].locked = !characters[charIndex].locked;
                    saveCharacterSheet(characters[charIndex]); // Save the lock status change
                    renderList();
                }
            }
        });

        // Turn Controls
        nextTurnButton.addEventListener('click', () => {
            if (characters.length === 0) return;
            currentTurnIndex++;
            if (currentTurnIndex >= characters.length) {
                currentTurnIndex = 0;
                currentRound++;
            }
            turnCounter.textContent = currentTurnIndex + 1;
            roundCounter.textContent = currentRound;
            renderList();
        });

        resetButton.addEventListener('click', () => {
            showModal('Are you sure you want to reset the encounter?', () => {
                currentTurnIndex = 0;
                currentRound = 0;
                turnCounter.textContent = '0';
                roundCounter.textContent = '0';
                renderList();
            });
        });

        // Sheet Logic
        const handleStatChange = (event, statName) => {
            if (selectedCharacter) {
                const newValue = event.target.textContent;
                selectedCharacter[statName] = parseInt(newValue, 10) || 0;
                renderList();
                saveCharacterSheet(selectedCharacter);
            }
        };

        const handleCheckboxChange = (event, type) => {
            if (selectedCharacter) {
                const key = event.target.id.replace(`${type}-`, '');
                selectedCharacter[type][key] = event.target.checked;
                saveCharacterSheet(selectedCharacter);
            }
        };

        const handleNotesChange = () => {
            if (selectedCharacter) {
                selectedCharacter.notes = sheetNotes.textContent;
                saveCharacterSheet(selectedCharacter);
            }
        };

        sheetHP.addEventListener('input', (e) => handleStatChange(e, 'hp'));
        sheetInitiative.addEventListener('input', (e) => handleStatChange(e, 'initiative'));
        sheetNotes.addEventListener('input', handleNotesChange);

        hpMinusBtn.addEventListener('click', () => {
            if (selectedCharacter) {
                selectedCharacter.hp = Math.max(0, (selectedCharacter.hp || 0) - 1);
                sheetHP.textContent = selectedCharacter.hp;
                renderList();
                saveCharacterSheet(selectedCharacter);
            }
        });

        hpPlusBtn.addEventListener('click', () => {
            if (selectedCharacter) {
                selectedCharacter.hp = (selectedCharacter.hp || 0) + 1;
                sheetHP.textContent = selectedCharacter.hp;
                renderList();
                saveCharacterSheet(selectedCharacter);
            }
        });
        
        initMinusBtn.addEventListener('click', () => {
            if (selectedCharacter) {
                selectedCharacter.initiative = Math.max(0, (selectedCharacter.initiative || 0) - 1);
                sheetInitiative.textContent = selectedCharacter.initiative;
                renderList();
                saveCharacterSheet(selectedCharacter);
            }
        });

        initPlusBtn.addEventListener('click', () => {
            if (selectedCharacter) {
                selectedCharacter.initiative = (selectedCharacter.initiative || 0) + 1;
                sheetInitiative.textContent = selectedCharacter.initiative;
                renderList();
                saveCharacterSheet(selectedCharacter);
            }
            
        });

        deleteSheetButton.addEventListener('click', () => {
            if (selectedCharacter) {
                showModal('Are you sure you want to delete this character?', async () => {
                    const charId = selectedCharacter.id;
                    try {
                        const docRef = getCharacterDocRef(charId);
                        await deleteDoc(docRef);
                        characters = characters.filter(char => char.id !== charId);
                        updateSheetDisplay(null);
                        renderList();
                    } catch (error) {
                        console.error("Error deleting document: ", error);
                    }
                });
            }
        });

        modifierCheckboxes.forEach(checkbox => {
            checkbox.addEventListener('change', (e) => handleCheckboxChange(e, 'modifiers'));
        });

        statusCheckboxes.forEach(checkbox => {
            checkbox.addEventListener('change', (e) => handleCheckboxChange(e, 'status'));
        });

        // Dice Roller Logic
        rollDiceButton.addEventListener('click', () => {
            const numDice = parseInt(numDiceInput.value, 10);
            const dieType = parseInt(dieTypeSelect.value, 10);
            const modifier = parseInt(rollModifierInput.value, 10) || 0;
            const rollType = document.querySelector('input[name="rollType"]:checked').value;
            let total = 0;
            const rolls = [];
            
            if (rollType === 'advantage') {
                const roll1 = Math.floor(Math.random() * dieType) + 1;
                const roll2 = Math.floor(Math.random() * dieType) + 1;
                const finalRoll = Math.max(roll1, roll2);
                rolls.push(`(Advantage: ${roll1}, ${roll2}) -> ${finalRoll}`);
                total = finalRoll;
            } else if (rollType === 'disadvantage') {
                const roll1 = Math.floor(Math.random() * dieType) + 1;
                const roll2 = Math.floor(Math.random() * dieType) + 1;
                const finalRoll = Math.min(roll1, roll2);
                rolls.push(`(Disadvantage: ${roll1}, ${roll2}) -> ${finalRoll}`);
                total = finalRoll;
            } else { // Normal or multiple dice
                for (let i = 0; i < numDice; i++) {
                    const roll = Math.floor(Math.random() * dieType) + 1;
                    rolls.push(roll);
                    total += roll;
                }
            }

            const modifierText = modifier !== 0 ? ` + ${modifier}` : '';
            rollResults.textContent = `Rolls: ${rolls.join(', ')}`;
            rollTotal.textContent = `Total: ${total + modifier}`;
        });

    </script>
</body>
</html>
